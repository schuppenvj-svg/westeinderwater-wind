name: wind-alert
on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 min (GitHub may delay runs a bit)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification now (ignores threshold, night rule and history)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: wind-alert
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check forecast and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          THRESHOLD_KNOTS: ${{ vars.THRESHOLD_KNOTS }}
          PORTRAIT_URL: ${{ vars.PORTRAIT_URL }}
          GUIDE_NAME: ${{ vars.GUIDE_NAME }}
          TEST_MODE: ${{ github.event.inputs.test == 'true' && '1' || '' }}
        run: python3 wind_alert.py
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "wind-bot"
            git config user.email "wind-bot@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
